# ---------- Prefix ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------- Keybindings ----------
bind r source-file ~/.tmux.conf       # Reload config
bind | split-window -h                # Split horizontally
bind - split-window -v                # Split vertically
bind y set-window-option synchronize-panes on    # Sync panes on
bind u set-window-option synchronize-panes off   # Sync panes off
bind p display-popup                  # Floating terminal

# ---------- General ----------
setw -g base-index 1                  # Start windows at 1
set -g renumber-windows on            # Renumber when a window closes
setw -g mode-keys vi                  # Vi keys in copy mode
set -g mouse on                       # Mouse support
set -g history-limit 25000            # Scrollback size
set -g default-terminal "tmux-256color"
set -g status-position top            # Status bar at top

# ---------- Colors ----------
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

# ---------- Status bar ----------
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #[default] #S #[fg=${gray_dark}]│#[default]"
set -g status-right "  #{cpu}  󰍛 #{mem}  #{disk -f} "
set -g window-status-current-format "#[fg=${cyan_soft},bold]#I:#W#[default]"
set -g window-status-format " #I:#W"

# ---------- Messages & borders ----------
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

# ---------- Plugins (TPM) ----------
# Install: prefix + I
# Update:  prefix + U
# Remove:  prefix + alt + u
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
